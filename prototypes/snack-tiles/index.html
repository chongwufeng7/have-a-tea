<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小吃叠叠消</title><link rel="stylesheet" href="style.css"></head><body>
<main id="viewport" class="viewport"><section id="scene" class="scene" aria-label="小吃叠叠消对局">
<div class="background" aria-hidden="true"><img src="assets/background-old.png" alt=""><img src="assets/background.png" alt=""><div class="background-wash"></div></div>
<div class="game-content">
<header class="levelhead" data-figma="44:761"><button id="levels" class="art-button levels" aria-label="选择测试关卡"><img src="assets/levels-base.png" alt=""><span>选关</span></button><div class="level-plaque"><img src="assets/level-plaque.svg" alt=""><h1 id="levelTitle">第 01 关</h1></div><button id="rules" class="art-button header-button rules" aria-label="玩法说明"><span class="button-crop"><img src="assets/rules-base.png" alt=""></span><span class="button-cover"></span><span class="header-icon"><img src="assets/icon-sheet.png" alt=""></span><b>玩法</b></button><button id="restart" class="art-button header-button restart" aria-label="重开本关"><span class="button-crop"><img src="assets/restart-base.png" alt=""></span><span class="button-cover"></span><span class="header-icon"><img src="assets/icon-sheet.png" alt=""></span><b>重开</b></button></header>
<div class="stats" data-figma="44:784"><span id="progressLabel">已消除 0 / 9</span><div id="progressTrack" class="progress" role="progressbar" aria-label="消除进度" aria-valuemin="0"><i id="progress"></i></div></div>
<div id="board" class="board" aria-label="叠牌区域"></div>
<section class="storage" data-figma="44:978" aria-label="临时区与暂存槽"><div class="wood-tray" aria-hidden="true"><img src="assets/wood-tray.png" alt=""></div><div class="reserve-row"><strong class="wood-label reserve-label">临时区</strong><div id="reserve" class="reserve" aria-label="三格临时区"></div><div class="match-tip"><img src="assets/bulb.svg" alt=""><span>集齐三张相同小吃<br>即可消除</span></div></div><div class="trayhead"><strong class="wood-label">暂存槽</strong><span class="wood-label"><b id="used">0</b> / 7</span></div><div id="tray" class="tray" aria-label="七格暂存槽"></div></section>
<div class="tools" data-figma="44:1020">
<button data-tool="undo" class="art-button tool"><img class="tool-base" src="assets/tool-base.png" alt=""><span class="tool-icon"><img src="assets/tool-icons.png" alt=""></span><b>撤回</b><img class="tool-badge" src="assets/tool-badge.png" alt=""><small>剩余1次</small></button>
<button data-tool="shuffle" class="art-button tool"><img class="tool-base" src="assets/shuffle-base.png" alt=""><span class="tool-icon"><img src="assets/tool-icons.png" alt=""></span><b>洗牌</b><img class="tool-badge" src="assets/tool-badge.png" alt=""><small>剩余1次</small></button>
<button data-tool="remove" class="art-button tool"><img class="tool-base" src="assets/tool-base.png" alt=""><span class="tool-icon"><img src="assets/tool-icons.png" alt=""></span><b>移出3张</b><img class="tool-badge" src="assets/tool-badge.png" alt=""><small>剩余1次</small></button></div></div>
<p id="feedback" class="feedback" role="status" aria-live="polite"></p></section></main>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialoghead"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭">×</button></div><div id="dialogBody"></div></dialog>
<dialog id="result" class="result" aria-labelledby="resultTitle"><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultActions" class="result-actions"></div></dialog>
<script src="game.js"></script><script src="ads.js"></script><script src="design-layout.js"></script><script src="app.js"></script></body></html>
